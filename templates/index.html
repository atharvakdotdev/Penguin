<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Linux Agent - Troubleshooting UI</title>
  <link rel="stylesheet" href="../static/style.css">
  <script src="../static/script.js" defer></script>
  <!-- Load Inter font for UI and JetBrains Mono for terminal feel -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet" />
  </head>

<body data-page="chat">
  <div data-purpose="application-root" id="app-window">
    <div style="display: flex; height: 100%;">
      <!-- BEGIN: Sidebar -->
      <aside class="sidebar">
        <div class="logo-container">
          <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
            stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
            <path d="m18 16 4-4-4-4"></path>
            <path d="m6 8-4 4 4 4"></path>
            <path d="m14.5 4-5 16"></path>
          </svg>
          <span>LINUX AGENT</span>
        </div>
        <p class="logo-subtitle"
          style="font-size: 0.7rem; color: var(--text-dim); margin-top: -15px; margin-bottom: 25px;">Autonomous Linux
          Troubleshooter</p>
        <a class="btn-new-session" id="newSessionButton" href="#">
          <span>New Session</span>
          <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
            stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h14"></path>
            <path d="M12 5v14"></path>
          </svg>
        </a>
        <div class="sessions-panel" id="sessionsPanel">
          <div class="sessions-header">
            <div class="sessions-header-title">
              <svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2.2" viewBox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              <span>Sessions</span>
            </div>
            <button class="action-btn" id="closeSessionsButton" type="button" style="padding: 4px 8px; font-size: 0.75rem;">Close</button>
          </div>
          <div class="session-list" id="sessionList"></div>
        </div>
        <ul class="nav-list" id="sidebarNavList">
          <li class="nav-item" data-role="sessions-toggle">
            <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            Sessions
          </li>
          <li class="nav-item" data-role="knowledge-base-nav" role="button" tabindex="0">
            <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
              <path d="M8 7h6"></path>
              <path d="M8 11h8"></path>
            </svg>
            Knowledge Base
          </li>
          <li class="nav-item" data-role="settings-nav">
            <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
              </path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Settings
          </li>
          
        </ul>
        <div class="plan-steps">
          <span class="section-title">PLAN / STEPS</span>
          <div id="hypothesisList" class="hypothesis-list" aria-live="polite"></div>
        </div>
        

      </aside>
      <!-- END: Sidebar -->
      <!-- BEGIN: Main Area -->
      <main class="main-container">
        <div class="top-bar">
          <div class="session-info">
            <button class="control-btn" id="sidebarToggle" type="button" aria-label="Collapse sidebar">
              <svg class="sidebar-toggle-icon" fill="none" height="16" stroke="currentColor" stroke-linecap="round"
                stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16"
                xmlns="http://www.w3.org/2000/svg">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span data-session-title>Live Session</span>
            <span class="tag-active">ACTIVE</span>
          </div>
        </div>
        <div id="chatMessages" class="chat-scroll-area">
          <div class="message-block">
            <div class="message-header">
              <span class="agent-label">
                <svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2" viewbox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg">
                  <path d="m16 18 6-6-6-6"></path>
                  <path d="m8 6-6 6 6 6"></path>
                  <path d="m14.5 4-5 16"></path>
                </svg>
                LINUX AGENT
              </span>
              <span class="timestamp">now</span>
            </div>
            <div class="message-content">
              I’m ready to help with Linux troubleshooting. Ask me anything.
            </div>
          </div>
        </div>
        <div class="input-wrapper">
          <div class="chat-input-container">
            <input id="chatInput" placeholder="Ask me to fix your Linux issue..." type="text" />
            <button id="sendButton" type="button"
              style="background: transparent; border: none; color: var(--accent-green); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;">
              <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
                <line x1="22" x2="11" y1="2" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
          <div class="chat-actions">
            <input id="logFileInput" accept=".txt,text/plain" type="file" hidden />
            <button class="action-btn" id="attachLogButton" type="button"><svg fill="none" height="14"
                stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                viewbox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" x2="12" y1="15" y2="3"></line>
              </svg> Attach Log</button>
            <div class="attachment-status" id="attachmentStatus" aria-live="polite">
            <span id="attachmentLabel">No file attached</span>
            <button class="attachment-clear" id="attachmentClear" type="button">clear</button>
          </div>
            <button class="action-btn btn-stop" id="stopAgentButton" type="button"><svg fill="none" height="14" stroke="currentColor"
                stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="14"
                xmlns="http://www.w3.org/2000/svg">
                <rect height="12" rx="2" width="12" x="6" y="6"></rect>
              </svg> Stop Agent</button>
          </div>
          
        </div>
      </main>
      <!-- END: Main Area -->
      <!-- BEGIN: Right Inspector -->
      <aside class="right-panel">
        <div class="right-panel-resizer" id="rightPanelResizer" aria-hidden="true"></div>
        <div class="model-selector">
          <label class="model-selector-label" for="modelSelect">Model:</label>
          <select class="model-select" id="modelSelect" aria-label="Select Ollama model">
            <option value="">Loading models...</option>
          </select>
        </div>

        <div class="command-output-wrapper">
          <div class="terminal-header">
            <span class="section-title" style="margin-bottom: 0;">COMMAND OUTPUT</span>
            <div class="live-tag">
              <div class="status-dot" style="width: 5px; height: 5px;"></div>
              Live
            </div>
          </div>
          <div class="terminal-window">
            <!-- <div class="terminal-cmd">$ rfkill list wifi</div>
            <div class="terminal-res">Soft blocked: yes<br />Hard blocked: no</div>
            <span class="terminal-time">21:42:24</span>
            <div class="terminal-cmd">$ rfkill unblock wifi</div>
            <span class="terminal-time">21:42:26</span>
            <div class="terminal-cmd">$ nmcli device wifi list</div>
            <div class="terminal-res">
              <span style="color: var(--accent-green);">* 3C:BB:FD:12:34:56 MyHomeWiFi</span><br />
                80:2A:A8:11:22:33 OtherWiFi
            </div>

            <div class="terminal-cmd">$ nmcli device wifi connect MyHomeWiFi...</div>
            <div class="terminal-res">Device 'wlan0' successfully activated.</div>
            <span class="terminal-time">21:42:30</span>
            <div class="terminal-cmd">$ ping -c 3 8.8.8.8</div>
            <div class="terminal-res">3 packets transmitted, 3 received, 0% loss</div>
            <span class="terminal-time">21:42:33</span> -->
          </div>
          <!-- <button class="btn-full-terminal">
            Open Full Terminal
            <svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2" viewbox="0 0 24 24" width="14" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" x2="21" y1="14" y2="3"></line>
            </svg>
          </button> -->
        </div>
      </aside>
      <!-- END: Right Inspector -->
    </div>
  </div>
  <div class="modal-backdrop hidden" id="knowledgeBaseModal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="knowledgeBaseDialogTitle">
      <h3 id="knowledgeBaseDialogTitle">Knowledge Base</h3>
      <p>RAG coming soon.</p>
      <button class="action-btn" id="knowledgeBaseCloseButton" type="button">Close</button>
    </div>
  </div>
  </body>

</html>
